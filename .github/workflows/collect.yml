name: collect

on:
  schedule:
    # 每週四 23:00 台北時間 = 15:00 UTC
    - cron: "0 15 * * 4"
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下
                            # 注意：要按工作流程頁的「Run workflow」。
                            # 按舊執行的「Re-run jobs」會在當時那個 commit 上重跑，
                            # 抓到的是舊版程式碼，而且 push 一定會被拒。

permissions:
  contents: write           # 需要 commit events.jsonl 回 repo

concurrency:
  # 同一時間只跑一個，排隊而不是併行 —— 兩次抓取同時寫 events.jsonl
  # 會在 push 時打架。
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # rebase 需要完整歷史，預設的淺層 clone（depth=1）會失敗
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 離線測試（程式壞掉就別浪費對方頻寬）
        run: |
          python tests/test_robots.py
          python tests/test_jsonld.py
          python tests/test_classify.py
          python tests/test_pipeline.py

      - name: 抓取
        run: python scripts/run_collectors.py

      - name: Commit 資料變更
        run: |
          git config user.name  "super-crawler bot"
          git config user.email "actions@github.com"
          git add data/events.jsonl
          if git diff --staged --quiet; then
            echo "沒有變更"
            exit 0
          fi
          git commit -m "data: 抓取 $(date -u +%Y-%m-%d)"

          # 抓取要跑好幾分鐘，這期間 main 可能被推了新 commit。
          # 不先 rebase 就 push 會被 (fetch first) 拒絕 —— 2026-09-15 踩過。
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME"; then
              if git push; then
                echo "已推送"
                exit 0
              fi
              echo "第 $i 次 push 被搶先，重試"
            else
              git rebase --abort || true
              echo "第 $i 次 rebase 衝突（多半是另一次抓取同時在寫 events.jsonl）"
            fi
            sleep 5
          done
          echo "三次都失敗，資料沒有推上去"
          exit 1
