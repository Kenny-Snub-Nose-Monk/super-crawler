name: collect

on:
  schedule:
    # 每週四 23:00 台北時間 = 15:00 UTC
    - cron: "0 15 * * 4"
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下

permissions:
  contents: write           # 需要 commit events.jsonl 回 repo

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取
        run: python scripts/run_collectors.py

      - name: Commit 資料變更
        run: |
          git config user.name  "super-crawler bot"
          git config user.email "actions@github.com"
          git add data/events.jsonl
          if git diff --staged --quiet; then
            echo "沒有變更"
          else
            git commit -m "data: 抓取 $(date -u +%Y-%m-%d)"
            git push
          fi
