# 稅務來源 —— 抓的是「規則的原文」，不是活動。
#
# 每一條是一頁原文。scripts/collect_tax_sources.py 讀這裡，產出
# data/tax/snapshots/<id>.md 與 data/tax/sources.json。
# 起點是 2026-10 收到的「在台灣工作外國人的繳稅相關資訊」整理（6 個政府來源、
# 2 個民間來源、2 個官方工具），之後補上法規全文與 Talent Taiwan 的官方 FAQ。
#
# 欄位：
#   fetch    html（預設）/ talent_article / talent_faq / manual（只列連結，不抓）
#   select   內容容器，依序試。**一定要指定** —— 整頁取文字會混進導覽列與
#            頁尾的「更新日期:今天」，每週都是假變更。
#   follow   跟著頁內連結往下抓（見 crawler/tax/collect.py 的 TaxSource）
#   kind     government / law / non_government / tool
#            網站上的數字只引用 government 與 law；non_government 只當交叉比對。

