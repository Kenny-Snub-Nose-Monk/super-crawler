  <h3>租稅優惠簡介</h3>
  <p>　　外國專業人才延攬及僱用法第22條規定，從事專業工作且符合一定條件之外國特定專業人才，
  在我國無戶籍並因工作首次核准在我國居留者，或依規定取得就業金卡，在就業金卡有效期間受聘僱從事專業工作者，
  於首次成為我國居住者且薪資所得超過新臺幣300萬元之課稅年度起算5年內，其各該在我國居留滿183日之課稅年度
  薪資所得超過300萬元部分之半數免予計入綜合所得總額課稅。
