# 官方來源的英文名稱 —— 網站介面只用英文，原文標題（多半是中文）留在快照與 WebMCP 的回傳裡。
#
# scripts/export_site_data.py 會把這裡的名稱帶成 sources[].title_en。
# 指南、cite 區塊、fact 證據引用到的來源，以及 config/tax_sources.yaml 的每一個起點，
# 都必須有英文名稱 —— 少了就不匯出（網站上冒出一行中文標題，正是要避免的那種中英夾雜）。
# 爬蟲沿著連結找到、但沒被引用的子頁不需要；畫面上會退回「出版單位 + page」。
#
# 年度：114 年度 = 2025 tax year，115 年度 = 2026，116 年 = 2027。

