    evidence:
      - source: ntbt_special_talent_intro
        quote: 不適用所得基本稅額條例第12條第1項第1款有關海外所得課徵基本稅額規定
  special_talent_apply:
    label: The incentive is not automatic
    value: apply-by-deadline
    display: apply with your return, before the filing deadline
    topics: [incentives]
    note: Miss the deadline and that year's benefit is gone.
    evidence:
      - source: law_special_talent_regulation
        quote: 未於各該課稅年度綜合所得稅結算申報期間屆滿前依規定格式申請，不得適用
  special_talent_employer_change:
    label: Changing employer during the five years
    value: keeps-benefit
    display: you keep the benefit
    topics: [incentives]
    evidence:
      - source: law_special_talent_regulation
        quote: 於第一項所定租稅優惠五年期間內轉換雇主或工作，且仍從事符合前條第一項第二款專業工作者，得繼續適用本法第二十二條租稅優惠至五年期間屆滿

  # --- 股權報酬 ------------------------------------------------------------
  stock_options_other_income:
    label: Stock options from an overseas parent company
    value: other-income
    display: taxed as "other income" in the year you exercise
    topics: [equity]
    evidence:
      - source: mof_ruling_stock_options
        quote: 核屬所得稅法第14條第1項第10類規定之其他所得，計入執行年度之所得額
  stock_options_proration:
    label: Taiwan-source share of a stock option gain
    value: days-ratio
    display: prorated by your days in Taiwan between grant and first exercise date
    topics: [equity]
    evidence:
      - source: mof_ruling_stock_options
        quote: 依員工於上開期間內在我國境內居留之天數，佔該期間之比例，計算我國來源所得

  # --- 申報時程 ------------------------------------------------------------
  filing_window:
    label: Annual filing period
    value: [5, 1, 5, 31]
    display: 1 – 31 May
    topics: [filing]
    evidence:
      - source: law_income_tax_act
        quote: 納稅義務人應於每年五月一日起至五月三十一日止，填具結算申報書
  filing_2026:
    label: Filing period in 2026 (for tax year 2025)
    value: ["2026-05-01", "2026-06-01"]
    display: 1 May – 1 June 2026
    year: 2025
    topics: [filing]
    note: 31 May 2026 was a Sunday, so the deadline moved to Monday 1 June.
    evidence:
      - source: mof_filing_2026
        quote: 114年度綜合所得稅結算申報末日原為115年5月31日，適逢週日順延至6月1日(週一)
  income_query_2026:
    label: Income and deduction data opened for download (2026)
    value: "2026-04-28"
    display: 28 April 2026, 8:00
    year: 2025
    topics: [filing]
    evidence:
      - source: mof_filing_2026
        quote: 將於115年4月28日上午8時開放查調
  refunds_2026:
    label: Refund batches for tax year 2025
    value: ["2026-07-31", "2026-10-30", "2027-01-20"]
    display: 31 Jul 2026 · 30 Oct 2026 · 20 Jan 2027
    year: 2025
    topics: [filing]
    evidence:
      - source: mof_refund_batches_2026
        quote: 分別於今年7月31日，10月30日及116年1月20日辦理3批次退稅
  departure_filing:
    label: Residents leaving Taiwan for good mid-year
    value: before-departure
    display: file before you leave
    topics: [filing, departure]
    evidence:
      - source: law_income_tax_act
        quote: 於年度中廢止中華民國境內之住所或居所離境者，應於離境前就該年度之所得辦理結算申報納稅
  departure_proration:
    label: Exemptions and deductions in your departure year
    value: prorated
    display: prorated by days resident
    topics: [departure, deductions]
    evidence:
      - source: mof_faq_resident_deductions
        quote: 其免稅額、標準扣除額及基本生活費，應按當年度在中華民國境內居住日數占全年日數之比例換算減除
  penalty_not_filed:
    label: Penalty for not filing at all
    value: 3
    display: up to 3× the tax due
    topics: [filing]
    evidence:
      - source: dhsc_salary_tax
        quote: 如未依法辦理申報者，將處補稅額３倍以下之罰鍰
  penalty_underreported:
    label: Penalty for under-reporting
    value: 2
    display: up to 2× the tax missed
    topics: [filing]
    evidence:
      - source: dhsc_salary_tax
        quote: 應處漏稅額２倍以下之罰鍰

