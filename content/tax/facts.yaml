# 稅務數字與規則 —— 網站上每一個稅務數字的唯一出處。
#
# 每一筆都要有 evidence：data/tax/snapshots/ 裡哪一份快照、哪一句原文。
# scripts/collect_tax_sources.py 每週抓完會核對引述還在不在（比對時忽略空白、全半形）：
#   對得上 → 網站照常顯示「已核對」
#   對不上 → 網站標「待複核」，數字照樣顯示但會提醒使用者
# 所以引述要挑「數字所在的那一句」，不要挑整段 —— 整段的話，旁邊改一個字也會誤報。
#
# 指南裡用 {{fact:<id>}} 引用；試算用的參數在 params.yaml 指到這裡。
# label / display / note 是給外國讀者看的英文；quote 是原文，不翻譯。
#
# 2026-10-15 整理。來源核對過程見 docs/adr/0003-tax-facts-pinned-to-snapshots.md。

facts:
  # --- 居住者判定 ----------------------------------------------------------
  residency_days:
    label: Days in Taiwan in a calendar year that make you a tax resident
    value: 183
    display: 183 days
    topics: [residency]
    evidence:
      - source: law_income_tax_act
        quote: 於一課稅年度內在中華民國境內居留合計滿一百八十三天者
  tax_year:
    label: Tax year
    value: calendar
    display: 1 January – 31 December
    topics: [residency]
    evidence:
      - source: mof_tax_year
        quote: 自1月1日起至同年12月31日止為一課稅年度
  day_counting:
    label: How days are counted
    value: arrival-excluded
    display: arrival day not counted, departure day counted
    topics: [residency]
    note: Every trip in the same calendar year is added together, based on passport stamps or the immigration agency's entry/exit certificate.
    evidence:
      - source: mof_day_counting
        quote: 始日不計末日計
      - source: ntbt_en_period_of_stay
        quote: excluding the date of arrival and including the date of departure
  day_counting_example:
    label: MOF's own worked example
    value: 111
    display: arrive 1 Aug, leave 20 Nov → 111 days
    topics: [residency]
    evidence:
      - source: mof_saving_manual_alien
        quote: 114年8月1日入境，11月20日出境後未再入境，當年度Ｂ君在臺居住共111天
  foreign_employer_90:
    label: Pay from an overseas employer when you stay 90 days or fewer
    value: exempt
    display: not taxed in Taiwan
    topics: [residency, nonresident]
    evidence:
      - source: law_income_tax_act
        quote: 於一課稅年度內在中華民國境內居留合計不超過九十天者，其自中華民國境外僱主所取得之勞務報酬不在此限
  foreign_employer_over_90_rate:
    label: Pay from an overseas employer when you stay over 90 but under 183 days
    value: 0.18
    display: 18%, self-reported
    topics: [nonresident]
    evidence:
      - source: ntbt_en_rate_applicable
        quote: remunerations paid by employers outside the R.O.C. for services rendered in the R.O.C. shall be filed and taxed at the rate of 18%
      - source: ntbt_nonresident_rate
        quote: 按18%扣繳率申報納稅
  entry_exit_certificate_fee:
    label: Entry/exit date certificate from the National Immigration Agency
    value: 100
    display: NT$100 at a service station
    topics: [residency]
    evidence:
      - source: immigration_entry_exit_certificate
        quote: 在國內申請者，繳交規費新臺幣一百元

